name: release
on:
  push:
    tags: ["v*"]
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  release:
    uses: farcloser/limen/.github/workflows/limen-release-apple.yaml@d2bf2f8b71f612a92039a4ab29bd7bde5499f5b0 # v0.21.0
    permissions:
      contents: write
      id-token: write
      attestations: write
    # Passed by name, not inherited: `inherit` passes this workflow's scope,
    # where an environment's secret is nothing, so the lane's sign job read
    # them empty (v0.0.0-test.5). A secret passed by name is resolved in the
    # called job that declares the environment, GitHub's documented case.
    secrets:
      APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
      APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
      APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
      APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
