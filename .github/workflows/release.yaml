# Diverges from limen's canonical release.yaml in having two jobs: `sign`,
# this project's (macOS, the `release` environment, the Developer ID identity,
# the notarization credentials, their removal, the asset upload), and
# `publish`, the canonical job with `runs-on`, the asset download and the
# attest step's subject paths changed. Keep everything else in sync.
#
# The workflow half of the release lane:
# `just do release vX.Y.Z` verifies the tree, creates the SIGNED tag and
# pushes it; that push runs the two jobs below. `sign` builds, signs,
# notarizes and packages the bundle; `publish` has no Apple secret and runs
# `just do release --ci`, which verifies what `sign` handed over, signs
# keyless and publishes (defined in .limen/just/release.just, not here). Pair
# with a ruleset restricting who can create v* tags: the tag push is the
# release button.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

# One run PER TAG, never cancelled: keyed by ref, not a constant — a constant
# group keeps only the newest pending run, so pushing several tags at once
# silently cancels the older releases. A re-push of the same tag serializes
# behind the in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

# Explicit bash: windows defaults to PowerShell, and bash brings -eo pipefail.
defaults:
  run:
    shell: bash

jobs:
  # Project job: the one that holds the certificate. While the identity is in
  # its keychain, what runs is the pinned toolchain (hermetic, just, xcodebuild
  # through the recipes) and Apple's tools: actions/checkout runs before the
  # identity is imported, actions/upload-artifact after it is removed, and
  # goreleaser, cosign and the attestation live in `publish`, which never sees
  # the secrets. Its token is read-only.
  sign:
    runs-on: macos-15
    timeout-minutes: 30
    # The signing and notarization secrets are the `release` environment's,
    # which only a v* tag may deploy to and which waits for the owner's
    # approval: a workflow on any other ref is refused them by GitHub, whatever
    # the file says.
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build number is the commit count, so the history must be whole.
          persist-credentials: false
          fetch-depth: 0

      - name: Install hermetic (pinned, verified)
        uses: ./.github/actions/setup-hermetic

      # The Developer ID Application identity the bundle is signed with, per
      # the signing and provenance policy (limen's book/releasing.md): a
      # bundle a human installs through System Settings is evaluated by
      # Gatekeeper, so it is signed, notarized and stapled. The certificate
      # goes into a keychain made for this job and deleted at its end, never
      # into the login keychain and never onto disk unencrypted. An
      # environment without the secrets fails here, before anything builds.
      - name: Signing identity
        env:
          P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          [ -n "$P12_BASE64" ] && [ -n "$P12_PASSWORD" ] || {
            echo "the signing secrets are not set" >&2; exit 1; }
          keychain="$RUNNER_TEMP/grid-clock-signing.keychain-db"
          # Named to the cleanup step first, so it finds the keychain even
          # when a step below fails.
          echo "GRID_CLOCK_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          password="$(openssl rand -hex 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 1800 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$P12_BASE64" | base64 -d > "$RUNNER_TEMP/identity.p12"
          security import "$RUNNER_TEMP/identity.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/identity.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: .*\)"$/\1/p' | head -n 1)"
          [ -n "$identity" ] || {
            echo "no Developer ID Application identity in the imported certificate" >&2; exit 1; }
          # xcodebuild's manual signing wants the team as well as the
          # identity; it is the ten characters in the identity's name,
          # read from the certificate rather than written into the project,
          # which pins no team so that a local build stays ad hoc.
          team="$(printf '%s' "$identity" | sed -n 's/.*(\([A-Z0-9]\{10\}\))$/\1/p')"
          [ -n "$team" ] || { echo "no team id in the identity's name: $identity" >&2; exit 1; }
          echo "GRID_CLOCK_SIGN_IDENTITY=Developer ID Application" >> "$GITHUB_ENV"
          echo "GRID_CLOCK_SIGN_TEAM=$team" >> "$GITHUB_ENV"

      # The App Store Connect API key notarytool submits with, written where
      # the notarize recipe reads it and removed at the end.
      - name: Notarization credentials
        env:
          KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY }}
        run: |
          [ -n "$KEY_ID" ] && [ -n "$ISSUER_ID" ] && [ -n "$KEY_BASE64" ] || {
            echo "the notarization secrets are not set" >&2; exit 1; }
          key="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          printf '%s' "$KEY_BASE64" | base64 -d > "$key"
          chmod 0600 "$key"
          {
            echo "GRID_CLOCK_NOTARY_KEY=$key"
            echo "GRID_CLOCK_NOTARY_KEY_ID=$KEY_ID"
            echo "GRID_CLOCK_NOTARY_ISSUER_ID=$ISSUER_ID"
          } >> "$GITHUB_ENV"

      # The tag without its v is the version goreleaser will publish under, so
      # the asset name matches what `publish` looks up.
      - name: Build, sign, notarize and package
        env:
          TAG: ${{ github.ref_name }}
        run: just package "${TAG#v}"

      # The job's keychain and the API key go, success or not, before the one
      # action that runs after signing.
      - name: Remove the signing identity and the notarization key
        if: always()
        run: |
          [ -z "${GRID_CLOCK_SIGNING_KEYCHAIN:-}" ] || security delete-keychain "$GRID_CLOCK_SIGNING_KEYCHAIN" || true
          rm -f "${GRID_CLOCK_NOTARY_KEY:-/nonexistent}"

      # Hand-over to `publish`, within this run: the ditto zip keeps the
      # bundle's signature intact where a directory upload would not. Skipped
      # when packaging failed.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assets
          path: build/assets/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: sign
    # macOS, not the canonical ubuntu-24.04: verify-assets checks the bundle's
    # signature and ticket with codesign and stapler.
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      # Publish the GitHub release and its assets.
      contents: write
      # Keyless signing: cosign exchanges the workflow's OIDC token for a
      # short-lived Fulcio certificate bound to this workflow@tag identity;
      # the attestation below is signed the same way.
      id-token: write
      # Store the build provenance attestations.
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser walks the full history to find the previous tag, where
          # GitHub's generated notes start; the git credential is not needed
          # after checkout (publishing goes through the API with the
          # step-scoped token below).
          persist-credentials: false
          fetch-depth: 0

      - name: Install hermetic (pinned, verified)
        uses: ./.github/actions/setup-hermetic

      # What `sign` made, where .release-go.yaml's extra_files and
      # verify-assets expect it.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: assets
          path: build/assets/

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # shellcheck disable=SC1010 # `do` is just's shared-task namespace, not the shell keyword.
          just do release --ci

      # Build provenance for what goreleaser published: the bundle's archive,
      # the installer and checksums.txt, so nothing fetched goes unattested;
      # verifiable with `gh attestation verify <asset> --repo forkcloser/grid-clock-screensaver`.
      # The paths are this project's: goreleaser's dist is build/release and
      # the assets ride in from build/assets (.release-go.yaml).
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: |
            build/assets/*.zip
            build/assets/install.sh
            build/release/checksums.txt
