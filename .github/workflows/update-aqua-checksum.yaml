# DO NOT EDIT MANUALLY.
# Generic, no project content. Renovate's other half: on its branches,
# regenerate aqua-checksums.json (a bumped pin with a stale checksum breaks
# every install) and, when the branch bumps farcloser/limen, run the branch's
# own pinned `limen fix` so the canonical files move with the pin. One fix-up
# commit.
#
# A WRITE workflow, hardened: `push:` on the branch prefix, never
# pull_request_target; no credential kept by checkout and no secrets in the
# update steps' environment; nothing runs through `just` (a write job does not
# execute recipe code the branch controls); the commit step uses runner tools
# only, with the token scoped to that step; the branch name reaches the shell
# via env; no loop, since a default-token commit triggers no workflows.
#
# The commit goes through GraphQL createCommitOnBranch because GitHub signs
# those and the main ruleset requires signatures (see the commit step). Its
# author is the token's identity: github-actions[bot] by default, or the
# App/PAT identity when UPDATE_AQUA_CHECKSUM_APP_ID (+ private key secret) or
# UPDATE_AQUA_CHECKSUM_TOKEN is set — that identity must be in renovate.json5's
# gitIgnoredAuthors or Renovate stops rebasing. The App is worth it:
# default-token commits get no CI run.
name: update-aqua-checksum

on:
  push:
    branches: ["renovate/**"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Explicit bash: windows defaults to PowerShell, and bash brings -eo pipefail.
defaults:
  run:
    shell: bash

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install aqua (pinned, checksum-verified)
        uses: ./.github/actions/setup-aqua
        with:
          # No token for aqua here: this job's token carries contents:write and
          # the steps below run a branch-declared binary. A rate-limit 403
          # fails loudly and is rerun; a write token in branch-controlled code
          # would not fail loudly.
          github-token: ""

      - name: Regenerate aqua-checksums.json
        # No tool install: update-checksum only reads the manifest and hashes
        # upstream artifacts — the smallest possible surface for a write job.
        # Runs first: it is what makes the branch's limen pin installable for
        # the converge step below.
        run: aqua update-checksum --prune

      - name: Converge the limen baseline
        # `aqua exec` resolves the branch's own limen pin, verified with the
        # checksums from the step above. A released limen leaves its own pin
        # alone, so this cannot ping-pong. Skipped in the limen repository:
        # there the working tree IS the next baseline.
        if: github.repository != 'farcloser/limen'
        run: aqua exec -- limen fix .

      - name: Mint a push token, if the App is configured
        # After the update steps, so those run with no secrets. One-hour token,
        # this repository only; the private key only mints.
        if: vars.UPDATE_AQUA_CHECKSUM_APP_ID != ''
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.UPDATE_AQUA_CHECKSUM_APP_ID }}
          private-key: ${{ secrets.UPDATE_AQUA_CHECKSUM_APP_PRIVATE_KEY }}
          # Least privilege, but both: naming any permission scopes the token to
          # exactly those, and the fix-up carries canonical workflow files whenever
          # a limen bump changed one. GitHub refuses that commit from a token
          # without workflows:write ("Resource not accessible by integration").
          permission-contents: write
          permission-workflows: write

      - name: Commit the update through the API, if any
        env:
          BRANCH: ${{ github.ref_name }}
          TOKEN: ${{ steps.app-token.outputs.token || secrets.UPDATE_AQUA_CHECKSUM_TOKEN || github.token }}
        run: |
          [ -z "$(git status --porcelain)" ] && { echo "checksums and baseline already in sync"; exit 0; }
          # GraphQL createCommitOnBranch, not `git commit` + push: those commits
          # are GitHub-signed, and the main ruleset requires signatures — an
          # unsigned fix-up commit made every aqua-bump PR unmergeable
          # (book/github.md).
          #
          # The whole dirty tree, on purpose: exactly two writers ran since
          # checkout (update-checksum and the pinned limen's fix), and a path
          # list baked into the older running workflow cannot know the new
          # baseline's surface.
          #
          # Limit of the mutation, accepted: FileAddition carries no file
          # mode, so an executable bit cannot travel — both writers here
          # only ever produce plain configuration files.
          additions="[]"
          deletions="[]"
          while IFS= read -r -d '' entry; do
            path="${entry:3}"
            if [ -f "${path}" ]; then
              additions="$(jq --arg path "${path}" --arg contents "$(base64 -w0 "${path}")" \
                '. + [{path: $path, contents: $contents}]' <<<"${additions}")"
            else
              deletions="$(jq --arg path "${path}" '. + [{path: $path}]' <<<"${deletions}")"
            fi
          done < <(git status --porcelain -z)
          # Signed-off-by: `just do lint commits` enforces DCO on the PR range,
          # bot commits included.
          payload="$(jq -n \
            --arg query 'mutation ($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }' \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg branch "${BRANCH}" \
            --arg head "$(git rev-parse HEAD)" \
            --argjson additions "${additions}" \
            --argjson deletions "${deletions}" \
            '{query: $query, variables: {input: {
              branch: {repositoryNameWithOwner: $repository, branchName: $branch},
              expectedHeadOid: $head,
              message: {
                headline: "chore: update aqua checksums and converge the limen baseline",
                body: "Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
              },
              fileChanges: {additions: $additions, deletions: $deletions}}}}')"
          # GraphQL reports failure in-body over HTTP 200, so success is the
          # presence of the new commit oid, never the HTTP status. No --retry
          # and no -L, on purpose: this is a mutation guarded by
          # expectedHeadOid — a retry after a success that timed out on the
          # way back would fail on the moved head and report a commit that
          # landed as an error, and a redirect must never replay the POST.
          response="$(curl --proto '=https' --tlsv1.2 -fsS -X POST -H "Authorization: bearer ${TOKEN}" \
            -d "${payload}" https://api.github.com/graphql)"
          oid="$(jq -r '.data.createCommitOnBranch.commit.oid // empty' <<<"${response}")"
          if [ -z "${oid}" ]; then
            echo "${response}" >&2
            exit 1
          fi
          echo "pushed ${oid}"
