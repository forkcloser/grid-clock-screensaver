# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# goreleaser — https://goreleaser.com — release automation for Grid Clock.
# Local dry-run: `just package && just do release --local --dry-run` (no tag, no
# publish, artifacts under build/release/). Real release: `just do release
# vX.Y.Z` (see .limen/just/release.just).
version: 2

project_name: grid-clock

# Everything lands under build/release/ — covered by the canonical .gitignore
# (/build); goreleaser's default dist/ is not. A subdirectory of build/, not
# build/ itself: goreleaser --clean wipes its dist directory, and the Xcode
# derived data the build recipe puts in build/ must survive a release run.
dist: build/release

# goreleaser cannot drive Xcode (the `prebuilt` builder is Pro-only): the
# assets are made by `just package` before goreleaser runs, in the release
# workflow's sign job, the only one that holds the signing identity, or
# locally for a dry run. They ride in via extra_files and the build pipe is
# skipped. The installer ships next to the bundle so it is version-matched
# and covered by the same checksums file it verifies against; the readme's
# one-liner runs THAT copy (releases/latest/download/install.sh), never main's.
before:
  hooks:
    # What arrived is this version's assets: the recipe in .justfile says what
    # it asserts.
    - just verify-assets {{ .Version }}

builds:
  - id: no-go-build
    skip: true

# A dry run is a snapshot, and its version must be the one `just package`
# zipped under: DEV_VERSION in .justfile. goreleaser's default template would
# name a version nothing was packaged as, and verify-assets would find no zip.
snapshot:
  version_template: '0.0.0'

# No archives: the artifact is already a zip, produced by `just package`. Wrapping
# it in a goreleaser archive would ship a zip inside a zip.
archives: []

checksum:
  # extra_files is what populates it: with no builds, the checksums file would
  # otherwise be empty.
  name_template: checksums.txt
  extra_files:
    - glob: build/assets/*.zip
    - glob: build/assets/install.sh

# cosign (v3, Sigstore bundle format) over the checksums file — signing that one
# file transitively covers every artifact it lists. Keyless: cosign exchanges
# the release workflow's OIDC token for a short-lived certificate bound to
# this workflow@tag identity, and the signature is logged in Rekor (limen's
# book/releasing.md, "The signing and provenance policy"); a local dry run
# skips signing.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: [sign-blob, --yes, --bundle, "${signature}", "${artifact}"]

release:
  extra_files:
    - glob: build/assets/*.zip
    - glob: build/assets/install.sh
  # Any prerelease-suffixed tag (e.g. the disposable v0.0.0-test.N tags used to
  # exercise the pipeline) is published as a GitHub prerelease, so it can never
  # become the repo's "latest release".
  prerelease: auto
  # Laptop releases fail halfway (network, guards) and get retried: overwrite
  # assets a previous partial attempt already uploaded instead of 422-ing on
  # "already_exists".
  replace_existing_artifacts: true
  # The notes below the header are GitHub's, from the pull requests merged
  # since the previous tag.
  header: |
    macOS 15 or later, Apple silicon. Download `grid-clock_{{ .Version }}_arm64.zip` below, unzip it and double-click `Grid Clock.saver`. Or from a terminal:

    ```sh
    curl --proto '=https' --tlsv1.2 -fsSL https://github.com/forkcloser/grid-clock-screensaver/releases/download/{{ .Tag }}/install.sh | bash
    ```

changelog:
  use: github-native
