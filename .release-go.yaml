# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# goreleaser — https://goreleaser.com — release automation for Grid Clock.
# Local dry-run: `just do release --local --dry-run` (no tag, no publish, artifacts
# under build/release/). Real release: `just do release vX.Y.Z` (see .limen/just/release.just).
version: 2

project_name: grid-clock

# Everything lands under build/release/ — covered by the canonical .gitignore
# (/build); goreleaser's default dist/ is not. A subdirectory of build/, not
# build/ itself: goreleaser --clean wipes its dist directory, and the Xcode
# derived data the build recipe puts in build/ must survive a release run.
dist: build/release

# goreleaser cannot drive Xcode (the `prebuilt` builder is Pro-only): the
# bundle comes from before-hooks, rides in via extra_files, and the build pipe
# is skipped.
before:
  hooks:
    # The `build` recipe itself, not a twin of it: the tag becomes the bundle's
    # version. The project file pins 0.0.0, so a bundle built any other way is
    # recognisably unversioned.
    - just build Release {{ .Version }}
    # Asserts version, bundle identifier, arm64 only, minimum macOS and the
    # hardened signature, Developer ID when the release workflow provides the
    # identity. v0.1.0 shipped universal, claiming 1.0.0 (1); this is the
    # gate that would have caught it.
    - just verify-bundle {{ .Version }}
    # Notarizes the signed bundle and staples the ticket, so a download
    # installs by double-click; skipped, and said so, where no identity is
    # set (a local dry run).
    - just notarize {{ .Version }}
    # ditto, not zip: it is the only archiver that preserves a macOS bundle's
    # symlinks, extended attributes, and code signature intact. A `zip -r` copy
    # can arrive with a broken signature, which Gatekeeper then rejects for a
    # reason that has nothing to do with how it was signed.
    - bash -c 'mkdir -p build/assets && rm -f build/assets/*.zip && ditto -c -k --sequesterRsrc --keepParent "build/Build/Products/Release/Grid Clock.saver" "build/assets/grid-clock_{{ .Version }}_arm64.zip"'
    # Ship the installer next to the bundle so it is version-matched and covered
    # by the same checksums file it verifies against. The readme's one-liner
    # runs THIS copy (releases/latest/download/install.sh), never main's.
    - bash -c 'cp install.sh build/assets/install.sh'

builds:
  - id: no-go-build
    skip: true

# No archives: the artifact is already a zip, produced by ditto above. Wrapping
# it in a goreleaser archive would ship a zip inside a zip.
archives: []

checksum:
  # extra_files is what populates it: with no builds, the checksums file would
  # otherwise be empty.
  name_template: checksums.txt
  extra_files:
    - glob: build/assets/*.zip
    - glob: build/assets/install.sh

# cosign (v3, Sigstore bundle format) over the checksums file — signing that one
# file transitively covers every artifact it lists. Keyless: cosign exchanges
# the release workflow's OIDC token for a short-lived certificate bound to
# this workflow@tag identity, and the signature is logged in Rekor (limen's
# book/releasing.md, "The signing and provenance policy"); a local dry run
# skips signing.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: [sign-blob, --yes, --bundle, "${signature}", "${artifact}"]

release:
  extra_files:
    - glob: build/assets/*.zip
    - glob: build/assets/install.sh
  # Any prerelease-suffixed tag (e.g. the disposable v0.0.0-test.N tags used to
  # exercise the pipeline) is published as a GitHub prerelease, so it can never
  # become the repo's "latest release".
  prerelease: auto
  # Laptop releases fail halfway (network, guards) and get retried: overwrite
  # assets a previous partial attempt already uploaded instead of 422-ing on
  # "already_exists".
  replace_existing_artifacts: true
  # The install one-liner is repeated where a visitor lands; the notes below
  # it are GitHub's, from the pull requests merged since the previous tag.
  header: |
    Install (macOS 14+, Apple silicon; verifies the release with cosign first):

    ```sh
    curl --proto '=https' --tlsv1.2 -fsSL https://github.com/forkcloser/grid-clock-screensaver/releases/download/{{ .Tag }}/install.sh | bash
    ```

changelog:
  use: github-native
